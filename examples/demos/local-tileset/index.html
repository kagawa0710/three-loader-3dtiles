<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Local 3D Tiles Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      max-width: 400px;
      z-index: 100;
    }
    #pick-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      max-width: 400px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="info">
    <div>Local 3D Tiles Viewer</div>
    <div id="stats"></div>
  </div>
  <div id="pick-info">Click to pick features</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { Loader3DTiles } from '../../../src/index.ts';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x333333);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000000);
    camera.position.set(0, 10, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    const gridHelper = new THREE.GridHelper(200, 50);
    scene.add(gridHelper);

    let runtime = null;

    const TILESET_URL = '/tileset/tileset.json';

    async function loadTileset() {
      try {
        const result = await Loader3DTiles.load({
          url: TILESET_URL,
          renderer: renderer,
          viewport: {
            width: window.innerWidth,
            height: window.innerHeight,
            devicePixelRatio: window.devicePixelRatio
          },
          options: {
            debug: true,
            maximumScreenSpaceError: 16,
            resetTransform: true,
            shading: 2
          }
        });

        scene.add(result.model);
        runtime = result.runtime;

        const tileBoxes = runtime.getTileBoxes();
        scene.add(tileBoxes);

        console.log('Tileset loaded!');
        document.getElementById('stats').innerText = 'Loaded!';
      } catch (e) {
        console.error('Failed to load tileset:', e);
        document.getElementById('stats').innerText = 'Error: ' + e.message;
      }
    }

    loadTileset();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      controls.update();

      if (runtime) {
        runtime.update(dt, camera);

        const stats = runtime.getStats();
        const tilesLoaded = stats.get('Tiles Loaded')?.count || 0;
        const tilesInView = stats.get('Tiles In View')?.count || 0;
        document.getElementById('stats').innerText = 
          `Tiles Loaded: ${tilesLoaded} | In View: ${tilesInView}`;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (runtime) {
        runtime.setViewport({
          width: window.innerWidth,
          height: window.innerHeight,
          devicePixelRatio: window.devicePixelRatio
        });
      }
    });

    renderer.domElement.addEventListener('click', (event) => {
      if (!runtime) return;

      const result = runtime.pick(event.clientX, event.clientY, camera);
      const pickInfo = document.getElementById('pick-info');

      if (result) {
        let info = `Tile: ${result.tileId}\n`;
        info += `Distance: ${result.distance.toFixed(2)}\n`;
        info += `Point: (${result.point.x.toFixed(2)}, ${result.point.y.toFixed(2)}, ${result.point.z.toFixed(2)})\n`;
        if (result.featureId !== undefined) {
          info += `Feature ID: ${result.featureId}\n`;
        }
        if (result.properties) {
          info += `Properties: ${JSON.stringify(result.properties, null, 2)}`;
        }
        pickInfo.innerText = info;
        console.log('Pick result:', result);
      } else {
        pickInfo.innerText = 'No feature picked';
      }
    });
  </script>
</body>
</html>
