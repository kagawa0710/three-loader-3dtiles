<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealityCapture Export | Three Loader 3DTiles</title>
  <link rel="stylesheet" href="../shared-styles.css">
  <style>
    #stats-widget {
      position: fixed;
      top: 70px;
      left: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      z-index: 50;
    }
    #stats-widget div {
      width: 280px;
      word-break: break-all;
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
    }
    @media (max-width:640px) {
      .info-panel, #stats-widget { display: none; }
    }
  </style>
</head>
<body class="demo-page">
  <div id="canvas-parent"></div>
  <a href="../index.html" class="back-link">Back to Demos</a>
  <div id="stats-widget"></div>

  <div class="info-panel">
    <h2>RealityCapture Export</h2>
    <p id="example-desc"><strong>Freeman Alley, New York.</strong> Captured with iPhone 12 Pro Max and processed via RealityCapture.</p>
    <div class="controls">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Arrows</kbd> - Move</p>
      <p><kbd>Mouse drag</kbd> - Rotate</p>
      <p><kbd>Scroll</kbd> - Move forward/backward</p>
    </div>
    <div class="section">
      <div class="section-title">URL Parameters</div>
      <p><kbd>tilesetUrl</kbd> - Custom tileset JSON</p>
      <p><kbd>sse</kbd> - Screen space error</p>
    </div>
  </div>

  <script type='module'>
    import { 
      Scene, 
      PerspectiveCamera, 
      WebGLRenderer, 
      Clock,
      Matrix4,
      Vector2,
      Euler,
      SRGBColorSpace,
    } from 'three';

    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';

    import { Loader3DTiles } from '../../../src/index.ts';

    import { CameraRig, FreeMovementControls } from 'three-story-controls'

    import Stats from 'three/examples/jsm/libs/stats.module.js';
    import StatsWidget from '@probe.gl/stats-widget';

    const queryParams = new URLSearchParams(document.location.search);

    const canvasParent = document.querySelector('#canvas-parent');
    const statsParent = document.querySelector('#stats-widget')

    const scene = new Scene();
    const camera = new PerspectiveCamera(
      35,
      1,
      0.01,
      1000,
    );

    const viewportSize = new Vector2();
    const renderer = new WebGLRenderer();
    renderer.outputColorSSpace = SRGBColorSpace;

    const clock = new Clock()
    const rig = new CameraRig(camera, scene)
    
    let controls = undefined;

    if (queryParams.get('orbit')) {
      controls = new OrbitControls( camera, canvasParent);
      controls.listenToKeyEvents( document.body );
      camera.position.set(0,200,0);
      controls.update();
    } else {
      controls = new FreeMovementControls(rig, {
        panDegreeFactor: 2,
        wheelScaleFactor: 0.01,
        keyboardScaleFactor: 0.015,
        keyboardDampFactor: 0
      });
      controls.enable();
    }
    
    canvasParent.appendChild(renderer.domElement);

    const threeJsStats = new Stats();
    threeJsStats.domElement.style.position = 'absolute';
    threeJsStats.domElement.style.top = '10px';
    threeJsStats.domElement.style.left = '10px';

    canvasParent.appendChild( threeJsStats.domElement );


    let tilesRuntime = undefined;
    let statsRuntime = undefined;

    if (queryParams.get('tilesetUrl')) {
      document.querySelector('#example-desc').style.display = 'none';
    }

   loadTileset();

    async function loadTileset() {
      const result = await Loader3DTiles.load(
        {
          url:
            queryParams.get('tilesetUrl') ??
           'https://int.nyt.com/data/3dscenes/ONA360/TILESET/0731_FREEMAN_ALLEY_10M_A_36x8K__10K-PN_50P_DB/tileset_tileset.json',
           viewport: getViewport(),
          options: {
            dracoDecoderPath: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco',
            basisTranscoderPath: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis',
            maximumScreenSpaceError: queryParams.get('sse') ?? 48,
            resetTransform: true
          }
      });

      const {model, runtime} = result;
      model.rotation.set(-Math.PI / 2, 0, Math.PI / 2);

      if (!queryParams.get('tilesetUrl')) {
        model.position.set(-1, 4, -16);
      }

      tilesRuntime = runtime;
      scene.add(model);

      statsRuntime = new StatsWidget(runtime.getStats(), {container: statsParent });
      statsParent.style.visibility = 'visible';
    }

    function render(t) {
      const dt = clock.getDelta()
      controls.update(t);
      if (tilesRuntime) {
        tilesRuntime.update(dt, camera);
      }
      if (statsRuntime) {
        statsRuntime.update();
      }
      renderer.render(scene, camera);
      threeJsStats.update();
      window.requestAnimationFrame(render);

    }

    onWindowResize();

    function onWindowResize() {
      renderer.setSize(canvasParent.clientWidth, canvasParent.clientHeight);
      tilesRuntime?.setViewport(getViewport());
      camera.aspect = canvasParent.clientWidth / canvasParent.clientHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onWindowResize)

    function getViewport() {
      return {
        width: canvasParent.clientWidth,
        height: canvasParent.clientHeight,
        devicePixelRatio: window.devicePixelRatio
      }
    }

    render();
  </script>
  <a class="source-btn" target="_blank" href="https://github.com/kagawa0710/three-loader-3dtiles/blob/dev/examples/demos/realitycapture/index.html" title="View source code">
    <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
  </a>
</body>
</html>
