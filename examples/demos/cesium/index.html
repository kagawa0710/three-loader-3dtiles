<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium ION Point Cloud | Three Loader 3DTiles</title>
  <link rel="stylesheet" href="../shared-styles.css">
  <style>
    #stats-widget {
      position: fixed;
      top: 70px;
      left: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      width: 280px;
      word-break: break-all;
      visibility: hidden;
      z-index: 50;
    }
    @media (max-width:640px) {
      .info-panel, #stats-widget { display: none; }
    }
  </style>
</head>
<body class="demo-page">
  <div id="canvas-parent"></div>
  <a href="../index.html" class="back-link">Back to Demos</a>
  <div id="stats-widget"></div>

  <div class="info-panel">
    <h2>Cesium ION Point Cloud</h2>
    <p>LiDAR point cloud data demonstrating point cloud tile rendering.</p>
    <div class="controls">
      <p><kbd>Arrows</kbd> / <kbd>Scroll</kbd> - Move</p>
      <p><kbd>Left click + drag</kbd> - Rotate</p>
    </div>
    <div class="section">
      <div class="section-title">URL Parameters</div>
      <p><kbd>assetId</kbd> - Cesium ion asset ID</p>
      <p><kbd>ionToken</kbd> - Access token</p>
    </div>
  </div>

  <script type='module'>
    import { 
      Scene, 
      PerspectiveCamera, 
      WebGLRenderer, 
      GridHelper, 
      Clock,
      Matrix4,
      Vector2,
      Euler
    } from 'three';

    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';

    import { Loader3DTiles, PointCloudColoring } from '../../../src/index.ts';

    import Stats from 'three/examples/jsm/libs/stats.module.js';
    import StatsWidget from '@probe.gl/stats-widget';

    const ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3NjEwMjA4Ni00YmVkLTQyMjgtYjRmZS1lY2M3ZWFiMmFmNTYiLCJpZCI6MjYxMzMsImlhdCI6MTY3NTM2ODY4NX0.chGkGL6DkDNv5wYJQDMzWIvi9iDoVa27dgng_5ARDmo'

    const canvasParent = document.querySelector('#canvas-parent');
    const statsParent = document.querySelector('#stats-widget')

    const scene = new Scene();
    const camera = new PerspectiveCamera(
      35,
      1,
      0.01,
      10000,
    );
    camera.position.set(0, 4000, 0);

    const renderer = new WebGLRenderer();
    const clock = new Clock()
    const controls = new OrbitControls( camera, canvasParent);
    controls.listenToKeyEvents( window );

    canvasParent.appendChild(renderer.domElement);

    const threeJsStats = new Stats();
    threeJsStats.domElement.style.position = 'absolute';
    threeJsStats.domElement.style.top = '10px';
    threeJsStats.domElement.style.left = '10px';

    canvasParent.appendChild( threeJsStats.domElement );

    const queryParams = new URLSearchParams(document.location.search);

    loadTileset();

    let tilesRuntime = undefined;
    let statsRuntime = undefined;

    async function loadTileset() {
      const result = await Loader3DTiles.load(
        {
          url: `https://assets.ion.cesium.com/${queryParams.get('assetId') ?? 43978}/tileset.json`,
          viewport: getViewport(),
          options: {
            cesiumIONToken: queryParams.get('ionToken') ?? ION_TOKEN, 
            dracoDecoderPath: 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco',
            pointCloudColoring: PointCloudColoring.RGB,
            maximumScreenSpaceError: 6,
            memoryAdjustedScreenSpaceError: false,
            resetTransform: true
          }
        }
      );

      const {model, runtime} = result;
      model.rotation.set(-Math.PI / 2, 0, 0);

      tilesRuntime = runtime;
      scene.add(model);

      statsRuntime = new StatsWidget(runtime.getStats(), {container: statsParent });
      statsParent.style.visibility = 'visible';

      onWindowResize();
    }

    function render(t) {
      const dt = clock.getDelta()
      controls.update();
      if (tilesRuntime) {
        tilesRuntime.update(dt, camera);
      }
      if (statsRuntime) {
        statsRuntime.update();
      }
      renderer.render(scene, camera);
      threeJsStats.update();
      window.requestAnimationFrame(render);

    }

    onWindowResize();


    function onWindowResize() {
      renderer.setSize(canvasParent.clientWidth, canvasParent.clientHeight);
      tilesRuntime?.setViewport(getViewport());
      camera.aspect = canvasParent.clientWidth / canvasParent.clientHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onWindowResize)

    function getViewport() {
      return {
        width: canvasParent.clientWidth,
        height: canvasParent.clientHeight,
        devicePixelRatio: window.devicePixelRatio
      }
    }

    render();
  </script>
  <a class="source-btn" target="_blank" href="https://github.com/kagawa0710/three-loader-3dtiles/blob/dev/examples/demos/cesium/index.html" title="View source code">
    <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
  </a>
</body>
</html>
